name: CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Lint with Ruff
      uses: astral-sh/ruff-action@v4.1.0
    - name: Format with Ruff
      uses: astral-sh/ruff-action@v4.1.0
      with:
        args: 'format --check'

  typing:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: pyproject.toml
    - name: Check types with ty
      run: |
        uv run ty check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
        openfoam-version: [9, 14, 2006, 2606]
        python-version: ['3.9', '3.14']
        dependency-resolution: [highest, lowest-direct]
        include:
          - os: macos-latest
            openfoam-version: 2112
            python-version: '3.9'
            dependency-resolution: lowest-direct
          - os: macos-latest
            openfoam-version: 2112
            python-version: '3.14'
            dependency-resolution: highest
          - os: macos-latest
            openfoam-version: 2606
            python-version: '3.9'
            dependency-resolution: lowest-direct
          - os: macos-latest
            openfoam-version: 2606
            python-version: '3.14'
            dependency-resolution: highest
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up OpenFOAM
      uses: gerlero/setup-openfoam@v1
      with:
        openfoam-version: ${{ matrix.openfoam-version }}
    - name: Install test dependencies
      run: |
        uv sync --python ${{ matrix.python-version }} --resolution ${{ matrix.dependency-resolution }}
    - name: Test with pytest
      run: |
        uv run pytest --cov=styro --cov-report xml
    - name: Upload code coverage results to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    - name: Check package build
      run: |
        uv build
