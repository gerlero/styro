[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "styro"
version = "0.1.36"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
description = "Package manager for OpenFOAM"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Gabriel S. Gerlero", email = "ggerlero@cimec.unl.edu.ar"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Software Distribution",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.6,<4",
    "aioshutil>=1,<2",
    "cyclopts>=3.24,<5",
    "typing_extensions>=4.4,<5; python_version < '3.12'",
]

[project.urls]
Homepage = "https://github.com/gerlero/styro"
Repository = "https://github.com/gerlero/styro"

[project.scripts]
styro = "styro.__main__:app"

[dependency-groups]
dev = [
    "pyinstaller>=5,<7",
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.16.5,<0.17",
    "ty>=0.0.76,<0.1",
]
